server:
  port: 8080

spring:
  application:
    name: mirage-sso-identity
  profiles:
    active: memory
  datasource:
    url: jdbc:mysql://localhost:3306/mirage_sso_identity?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: mirage
    password: mirage
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: assign_id

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

app:
  security:
    issuer: http://localhost:8080
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    login-failure-limit: 5
    login-lock-duration: 15m
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - http://localhost:5174
      - http://127.0.0.1:5174
      - http://localhost:5175
      - http://127.0.0.1:5175
      - http://localhost:5176
      - http://127.0.0.1:5176
  minio:
    endpoint: http://localhost:9000
    access-key: mirage
    secret-key: mirage-minio-secret
    bucket: images
    public-url: http://localhost:9000
